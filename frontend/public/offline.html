<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181817"><title>PlayPod – keine Verbindung</title><style>body{margin:0;background:#181817;color:#f0f2ed;font:16px/1.6 system-ui;display:grid;place-items:center;min-height:100dvh}main{max-width:420px;padding:24px}img{width:64px;height:64px;border-radius:16px}h1{font-size:24px}p{color:#a2ada3}button{font:inherit;padding:12px 20px;border:0;border-radius:12px;background:#c3ec89;color:#202d13}</style></head><body><main data-playpod-offline><img src="/icons/icon-192.png" alt="PlayPod"><h1 data-en="No connection to PlayPod">Keine Verbindung zu PlayPod</h1><p data-en="Your audio files and library are stored on your server. Reconnect to continue listening.">Die Audiodateien und der Katalog liegen auf deinem Server. Stelle die Verbindung wieder her, um weiterzuhören.</p><button data-en="Try again" onclick="location.reload()">Erneut versuchen</button></main><script>(()=>{let saved;try{saved=localStorage.getItem('playpod.language')}catch{}const languages=navigator.languages||[navigator.language];const detected=languages.map(x=>x.toLowerCase().split(/[-_]/)[0]).find(x=>x==='de'||x==='en')||'en';const language=saved==='de'||saved==='en'?saved:detected;document.documentElement.lang=language;if(language==='en'){document.title='PlayPod – offline';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset.en)}})();</script></body></html>
